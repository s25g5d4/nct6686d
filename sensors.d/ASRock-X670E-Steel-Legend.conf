# ASRock X670E Steel Legend
# Super I/O: Nuvoton NCT6686D (Customer ID 0x1632)
# Driver: https://github.com/s25g5d4/nct6686d

chip "nct6686-*"

    # === Voltages ===
    label in0 "VCore"
    label in1 "+5V"
    label in2 "+12V"
    label in4 "VDDCR_SOC"
    label in5 "VDD_MISC"
    label in6 "DRAM"
    label in7 "+3.3V"

    # Scaling computations for +5V and +12V resistor dividers
    compute in1 @*5, @/5
    compute in2 @*12, @/12

    # in3 (~1.55V) is an auxiliary voltage not reported in the UEFI H/W Monitor
    ignore in3

    # === Fan Headers ===
    # Motherboard headers according to ASRock specification:
    # fan1: CPU_FAN1 (1A / 12W)
    # fan2: CPU_FAN2/WP (2A / 24W)
    # fan3: CHA_FAN1/WP (2A / 24W)
    # fan4: CHA_FAN2/WP (2A / 24W)
    # fan5: CHA_FAN3/WP (2A / 24W)
    # fan6: CHA_FAN4/WP (2A / 24W)
    label fan1 "CPU_FAN1"
    label fan2 "CPU_FAN2/WP"
    label fan3 "CHA_FAN1/WP"
    label fan4 "CHA_FAN2/WP"
    label fan5 "CHA_FAN3/WP"
    label fan6 "CHA_FAN4/WP"

    # === Temperatures ===
    # temp1: Thermistor 16 (VRM or secondary board thermistor)
    # temp2: Thermistor 14 (Motherboard ambient sensor)
    # temp3: Thermistor 15 (Chipset / Promontory heatsink)
    # temp4: AMD TSI Addr 98h (CPU core diode)
    label temp1 "Aux"
    label temp2 "Motherboard"
    label temp3 "Chipset"
    label temp4 "CPU"

    # Unused or floating sensors
    ignore temp6
    ignore temp7
